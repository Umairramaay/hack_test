name: Deploy

on:
  push:
    branches: [main]

jobs:

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,REPO,APP_NAME,API_SECRET,VITE_API_BASE_URL,OPENAI_API_KEY,OPENAI_MODEL
          script: |
            cd /home/ubuntu/test/hack_test
            git pull https://x-access-token:$GITHUB_TOKEN@github.com/$REPO.git main

            # Write .env from GitHub secrets (never committed to the repo)
            printf "APP_NAME=%s\nAPI_SECRET=%s\nVITE_API_BASE_URL=%s\nOPENAI_API_KEY=%s\nOPENAI_MODEL=%s\n" \
              "$APP_NAME" "$API_SECRET" "$VITE_API_BASE_URL" "$OPENAI_API_KEY" "$OPENAI_MODEL" > .env

            chmod +x deploy.sh
            ./deploy.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APP_NAME: ${{ secrets.APP_NAME }}
          API_SECRET: ${{ secrets.API_SECRET }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
